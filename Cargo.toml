[package]
name = "deltu"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

# Registered explicitly: the architecture reserves `benchmarks/` for
# performance benchmarks, while Cargo autodiscovers only `benches/`.
[[bench]]
name = "processing"
path = "benchmarks/processing.rs"
harness = false

[[bench]]
name = "state"
path = "benchmarks/state.rs"
harness = false

[[bench]]
name = "rules"
path = "benchmarks/rules.rs"
harness = false
