[package]
name = "deltu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ECOCEE"]
repository = "https://github.com/ecocee/deltu"

[dependencies]
axum = "0.8"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
cron = "0.17.0"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
uuid = { version = "1.26.1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }
tower = { version = "0.5.3", features = ["util"] }

# Registered explicitly: the architecture reserves `benchmarks/` for
# performance benchmarks, while Cargo autodiscovers only `benches/`.
[[bench]]
name = "processing"
path = "benchmarks/processing.rs"
harness = false

[[bench]]
name = "state"
path = "benchmarks/state.rs"
harness = false

[[bench]]
name = "rules"
path = "benchmarks/rules.rs"
harness = false
