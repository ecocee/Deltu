# Release: full verification per target, then artifacts + checksums.
# Triggers on version tags (v*). x86_64 Linux native, ARM64 Linux via
# `cross` (Docker-based; per research/edge.md), macOS ARM64 native.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --lib
      - name: Bench smoke (one group, one sample)
        run: cargo bench --bench pipeline -- --quick 2>/dev/null || cargo bench --no-run

  build-linux-x86_64:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release --target x86_64-unknown-linux-gnu
      - run: strip target/x86_64-unknown-linux-gnu/release/deltu
      - uses: actions/upload-artifact@v4
        with:
          name: deltu-x86_64-unknown-linux-gnu
          path: target/x86_64-unknown-linux-gnu/release/deltu

  build-linux-aarch64:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - name: Install cross
        run: cargo install cross --locked
      - name: Cross-compile ARM64
        run: cross build --release --target aarch64-unknown-linux-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: deltu-aarch64-unknown-linux-gnu
          path: target/aarch64-unknown-linux-gnu/release/deltu

  build-macos-aarch64:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: strip target/aarch64-apple-darwin/release/deltu
      - uses: actions/upload-artifact@v4
        with:
          name: deltu-aarch64-apple-darwin
          path: target/aarch64-apple-darwin/release/deltu

  publish:
    needs: [build-linux-x86_64, build-linux-aarch64, build-macos-aarch64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum deltu-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deltu-*
            dist/SHA256SUMS
