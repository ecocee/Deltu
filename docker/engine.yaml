# Engine config for the compose stack: ingest MQTT from the broker, run
# the time-based scheduler, and forward alerts to actions.
# Serde shapes follow the engine's documented config format (rules use YAML
# external tags, actions use internal `type:` tags).
#
# Durability: the scheduler stays enabled and persists API-created
# schedules to /data/schedules.json (mounted as the `deltu-schedules`
# volume), so schedules survive engine restarts and even `docker compose
# down && up` — only an explicit `docker rm` of the volume loses them.
http:
  bind: 0.0.0.0:8080

mqtt:
  enabled: true
  broker_url: mqtt://mosquitto:1883
  topics:
    - "sensors/#"

rules:
  - id: door-open-log
    on: !Event
      kind: door
    condition: !Comparison
      field: !EventValue
      op: Eq
      value: !Text
        open
    action: demo-log

  - id: scheduler-bridge
    on: !Event
      kind: schedule.fired
    condition: !Exists { field: EventValue }
    action: alert-webhook

actions:
  - id: demo-log
    kind:
      type: log
      level: info

  - id: alert-webhook
    kind:
      type: webhook
      # Placeholder values: configure via environment overrides
      # DELTU_ACTION_ALERT_WEBHOOK_URL / DELTU_ACTION_ALERT_WEBHOOK_SECRET
      url: http://api:8000/deltu/webhook
      method: post
      headers:
        - name: "authorization"
          value: "Bearer placeholder"

scheduler:
  enabled: true
  snapshot_path: /data/schedules.json
  schedules: []
