# Engine config for the compose stack: ingest MQTT from the broker, run
# the time-based scheduler, and bridge `schedule.fired` events to Mero.
# Serde shapes follow the engine's documented config format (rules use YAML
# external tags, actions use internal `type:` tags).
#
# Durability: the scheduler stays enabled and persists API-created
# schedules to /data/schedules.json (mounted as the `deltu-schedules`
# volume), so schedules survive engine restarts and even `docker compose
# down && up` — only an explicit `docker rm` of the volume loses them.
http:
  bind: 0.0.0.0:8080

mqtt:
  enabled: true
  broker_url: mqtt://mosquitto:1883
  topics:
    - "sensors/#"

rules:
  - id: door-open-log
    on: !Event
      kind: door
    condition: !Comparison
      field: !EventValue
      op: Eq
      value: !Text
        open
    action: demo-log

  # The scheduler bridge: every real timed event (kind `schedule.fired`)
  # is forwarded to Mero, which executes the matching workflow. This
  # action id (`mero-bridge`) is the documented contract with the engine's
  # DELTU_MERO_BRIDGE_URL / DELTU_MERO_BRIDGE_SECRET env overrides.
  - id: mero-scheduler-bridge
    on: !Event
      kind: schedule.fired
    condition: !Exists { field: EventValue }
    action: mero-bridge

actions:
  - id: demo-log
    kind:
      type: log
      level: info

  - id: mero-bridge
    kind:
      type: webhook
      # Placeholder values: the compose stack patches BOTH at boot via the
      # engine's DELTU_MERO_BRIDGE_URL / DELTU_MERO_BRIDGE_SECRET env
      # overrides (see runtime/config.rs apply_env_overrides), pulling the
      # secret from the .env file. A repo config must never contain a real
      # secret, and an unset secret leaves the header inert -> Mero answers
      # 401, which is loud rather than silently wrong.
      url: http://api:8000/deltu/schedules/fired
      method: post
      headers:
        - name: "authorization"
          value: "Bearer placeholder"

scheduler:
  enabled: true
  # API-created schedules are persisted here (atomic write + rename) and
  # restored on startup, in addition to Mero's own projection/recovery.
  snapshot_path: /data/schedules.json
  schedules: []
